name: Website deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: greenskeeper-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Build public artifact
        run: python scripts/package_site.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify tools and private analytics before deploying
        env:
          QA_OUTPUT: ${{ runner.temp }}/greenskeeper-tools-qa
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/greenskeeper-preview.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4173/tools/ > /dev/null
          npm run test:browser
          npm run test:analytics-browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
