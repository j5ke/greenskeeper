name: Website and daily golf journal
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      generate_article:
        description: Generate one researched article before deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: greenskeeper-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule' || vars.AI_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate a researched article
        if: github.event_name == 'schedule' || inputs.generate_article == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/generate_post.py
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Build public artifact
        run: python scripts/package_site.py
      - name: Save generated article and static pages
        if: github.event_name == 'schedule' || inputs.generate_article == true
        run: |
          python scripts/build.py
          git config user.name "Greenskeeper Journal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts blog index.html home.html robots.txt sitemap.xml .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily golf journal article"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
